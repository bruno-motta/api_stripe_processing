spring.application.name=api

server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL_PAYMENT}
spring.datasource.username=${DB_USERNAME_PAYMENT}
spring.datasource.password=${DB_PASSWORD_PAYMENT}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true


spring.flyway.locations=classpath:db/migration

app.jwt.expiration=${JWT_EXPIRATION_PAYMENT}
app.jwt.secret=${JWT_SECRET_PAYMENT}